<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Table 2. Training parameters and classification performance of the BERT sentiment classification model</title>
  <desc id="desc">A clean vector recreation of the BERT sentiment classification model training parameters and classification performance table.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <style>
    .title { font: 700 30px Georgia, 'Times New Roman', serif; fill: #111; }
    .body { font: 28px Georgia, 'Times New Roman', serif; fill: #111; }
    .rule { stroke: #444; stroke-width: 2; }
    .light { stroke: #777; stroke-width: 1.6; }
  </style>

  <text x="56" y="64" class="title">Table 2. Training parameters and classification performance of the BERT sentiment classification model</text>

  <g transform="translate(440,188)">
    <rect x="0" y="0" width="520" height="620" fill="none" class="rule"/>
    <line x1="340" y1="0" x2="340" y2="620" class="rule"/>

    <line x1="0" y1="68.9" x2="520" y2="68.9" class="light"/>
    <line x1="0" y1="137.8" x2="520" y2="137.8" class="light"/>
    <line x1="0" y1="206.7" x2="520" y2="206.7" class="light"/>
    <line x1="0" y1="275.6" x2="520" y2="275.6" class="light"/>
    <line x1="0" y1="344.4" x2="520" y2="344.4" class="light"/>
    <line x1="0" y1="413.3" x2="520" y2="413.3" class="light"/>
    <line x1="0" y1="482.2" x2="520" y2="482.2" class="light"/>
    <line x1="0" y1="551.1" x2="520" y2="551.1" class="light"/>

    <text x="170" y="45" text-anchor="middle" class="body">Validation split</text>
    <text x="430" y="45" text-anchor="middle" class="body">0.1</text>

    <text x="170" y="114" text-anchor="middle" class="body">Batch size</text>
    <text x="430" y="114" text-anchor="middle" class="body">8</text>

    <text x="170" y="183" text-anchor="middle" class="body">Epochs</text>
    <text x="430" y="183" text-anchor="middle" class="body">5</text>

    <text x="170" y="252" text-anchor="middle" class="body">Learning rate</text>
    <text x="430" y="252" text-anchor="middle" class="body">2e-5</text>

    <text x="170" y="321" text-anchor="middle" class="body">Optimizer</text>
    <text x="430" y="321" text-anchor="middle" class="body">AdamW</text>

    <text x="170" y="390" text-anchor="middle" class="body">Precision</text>
    <text x="430" y="390" text-anchor="middle" class="body">0.976</text>

    <text x="170" y="459" text-anchor="middle" class="body">Recall</text>
    <text x="430" y="459" text-anchor="middle" class="body">0.968</text>

    <text x="170" y="528" text-anchor="middle" class="body">F1</text>
    <text x="430" y="528" text-anchor="middle" class="body">0.972</text>

    <text x="170" y="597" text-anchor="middle" class="body">Accuracy</text>
    <text x="430" y="597" text-anchor="middle" class="body">0.993</text>
  </g>
</svg>
